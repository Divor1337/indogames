<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>날아가는 새 게임</title>
  <meta name="description" content="고무줄로 하던 그 새 게임. 코드 입력하고 바로 시작해보세요." />

  <meta property="og:title" content="날아가는 새 게임" />
  <meta property="og:description" content="고무줄로 하던 그 새 게임 ㅋㅋ" />
  <meta property="og:type" content="website" />

  <style>
    :root {
      --sky: #72d9ff;
      --sky2: #bdf3ff;
      --blue: #1b6dff;
      --deep: #08213c;
      --card: rgba(255, 255, 255, 0.88);
      --card2: rgba(255, 255, 255, 0.72);
      --text: #102034;
      --muted: rgba(16, 32, 52, 0.66);
      --yellow: #ffd84a;
      --orange: #ff8a2a;
      --green: #42e86f;
      --pipe: #4fe64f;
      --red: #ff4d63;
      --stroke: rgba(255, 255, 255, 0.62);
      --shadow: 0 26px 80px rgba(8, 33, 60, 0.30);
      --radius: 30px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 216, 74, 0.46), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(79, 230, 79, 0.34), transparent 28%),
        linear-gradient(180deg, var(--sky2) 0%, var(--sky) 46%, #79e7b8 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 14% 28%, rgba(255,255,255,.86) 0 18px, transparent 19px),
        radial-gradient(circle at 20% 28%, rgba(255,255,255,.86) 0 24px, transparent 25px),
        radial-gradient(circle at 27% 28%, rgba(255,255,255,.86) 0 18px, transparent 19px),
        radial-gradient(circle at 76% 16%, rgba(255,255,255,.82) 0 16px, transparent 17px),
        radial-gradient(circle at 82% 16%, rgba(255,255,255,.82) 0 22px, transparent 23px),
        radial-gradient(circle at 88% 16%, rgba(255,255,255,.82) 0 15px, transparent 16px);
      opacity: .7;
    }

    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent, rgba(24, 148, 78, .28)),
        repeating-linear-gradient(90deg, rgba(28, 148, 60, .24) 0 18px, rgba(44, 184, 78, .20) 18px 36px);
      mask-image: linear-gradient(to top, black, transparent);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--stroke);
      background:
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.72)),
        var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      top: -84px;
      right: -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,216,74,.72), transparent 68%);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      left: -95px;
      bottom: -95px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79,230,79,.34), transparent 68%);
      pointer-events: none;
    }

    .inner {
      position: relative;
      z-index: 2;
      padding: 18px 14px 16px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(8, 33, 60, 0.08);
      border: 1px solid rgba(8, 33, 60, 0.08);
      color: rgba(8, 33, 60, 0.78);
      font-size: 12px;
      font-weight: 1000;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px rgba(66,232,111,.78);
      animation: pulse 1.45s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.72); opacity: .55; }
    }

    .tag {
      padding: 8px 11px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--yellow), #fff0a6);
      color: #112033;
      font-size: 12px;
      font-weight: 1000;
      white-space: nowrap;
      box-shadow: 0 10px 28px rgba(255, 216, 74, .28);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: -0.062em;
      font-weight: 1000;
    }

    .pop {
      display: inline-block;
      color: var(--yellow);
      text-shadow:
        -2px -2px 0 var(--deep),
         2px -2px 0 var(--deep),
        -2px  2px 0 var(--deep),
         2px  2px 0 var(--deep),
         0px  4px 0 rgba(8, 33, 60, .22);
    }

    .pop.blue {
      color: var(--blue);
      text-shadow:
        -2px -2px 0 rgba(255,255,255,.88),
         2px -2px 0 rgba(255,255,255,.88),
        -2px  2px 0 rgba(255,255,255,.88),
         2px  2px 0 rgba(255,255,255,.88),
         0px  4px 0 rgba(8, 33, 60, .12);
    }

    .sub {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 800;
    }

    .search-note {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(8, 33, 60, 0.08);
      color: rgba(16, 32, 52, 0.78);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 1000;
      box-shadow: 0 10px 24px rgba(8, 33, 60, 0.10);
    }

    .search-note b {
      color: var(--blue);
      letter-spacing: -0.01em;
    }

    .preview {
      position: relative;
      overflow: hidden;
      margin-top: 14px;
      border-radius: 24px;
      border: 3px solid rgba(255, 255, 255, 0.90);
      background: rgba(255,255,255,.52);
      box-shadow: 0 18px 48px rgba(8, 33, 60, 0.22);
    }

    .preview img {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 11;
      object-fit: cover;
      transform: scale(1.01);
    }

    .caption {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 16px;
      background: rgba(8, 20, 34, 0.72);
      border: 1px solid rgba(255,255,255,.20);
      color: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 1000;
    }

    .caption span:last-child {
      color: var(--yellow);
      white-space: nowrap;
    }

    .bonus {
      margin-top: 13px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,216,74,.95), rgba(255,138,42,.90));
      color: #112033;
      box-shadow: 0 16px 38px rgba(255, 138, 42, .22);
    }

    .bonus-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.18;
      font-weight: 1000;
      letter-spacing: -0.03em;
    }

    .bonus-sub {
      margin: 4px 0 0;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 850;
      color: rgba(17, 32, 51, .68);
    }

    .code-copy {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 9px;
      border: 0;
      border-radius: 15px;
      background: rgba(255,255,255,.92);
      color: #112033;
      font-size: 13px;
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(8, 33, 60, .12);
    }

    .code-copy b {
      letter-spacing: .05em;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      margin-top: 13px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(135deg, #ff4d63, #ff8a2a);
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 1000;
      letter-spacing: -0.02em;
      box-shadow: 0 18px 40px rgba(255, 77, 99, .26);
      transition: transform .14s ease, filter .14s ease;
    }

    .cta:active {
      transform: scale(.985);
      filter: brightness(.96);
    }

    .hint {
      margin-top: 8px;
      text-align: center;
      color: rgba(16, 32, 52, .52);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 800;
    }

    .guide {
      margin-top: 13px;
      border-radius: 20px;
      border: 1px solid rgba(8, 33, 60, .08);
      background: rgba(255, 255, 255, .48);
      overflow: hidden;
    }

    .guide summary {
      list-style: none;
      cursor: pointer;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: rgba(16, 32, 52, .86);
      font-size: 14px;
      font-weight: 1000;
    }

    .guide summary::-webkit-details-marker {
      display: none;
    }

    .arrow {
      color: rgba(16, 32, 52, .44);
      font-size: 12px;
    }

    .guide-body {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px;
    }

    .instruction-images {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .instruction-images figure {
      margin: 0;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(8, 33, 60, .08);
      background: rgba(255,255,255,.76);
    }

    .instruction-images img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .instruction-images figcaption {
      padding: 8px 10px;
      color: rgba(16, 32, 52, .64);
      font-size: 11px;
      line-height: 1.35;
      font-weight: 900;
      background: rgba(255,255,255,.68);
    }

    .mini-steps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mini-step {
      padding: 10px;
      border-radius: 15px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(8, 33, 60, .07);
      color: rgba(16, 32, 52, .76);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 900;
    }

    .toast {
      min-height: 17px;
      margin-top: 7px;
      color: rgba(16, 32, 52, .50);
      text-align: center;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
    }

    @media (max-width: 380px) {
      .page {
        padding: 14px 10px 20px;
      }

      .inner {
        padding: 16px 12px 14px;
      }

      h1 {
        font-size: 29px;
      }

      .sub {
        font-size: 13px;
      }

      .preview img {
        aspect-ratio: 16 / 12;
      }

      .cta {
        min-height: 56px;
        font-size: 17px;
      }

      .bonus {
        grid-template-columns: 1fr;
      }

      .code-copy {
        justify-content: center;
        min-height: 42px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-label="Tappy Bird landing">
      <div class="inner">

        <div class="topline">
          <div class="pill">
            <span class="dot"></span>
            요즘 찾는 그 게임
          </div>
          <div class="tag">🐤 TAPPY</div>
        </div>

        <section class="hero">
          <h1>
            <span class="pop">고무줄로 하던</span><br>
            <span class="pop blue">그 새 게임 ㅋㅋ</span>
          </h1>

          <p class="sub">
            영상에서 보던 그 게임 맞음.<br>
            코드 복사하고 바로 시작하면 됨.
          </p>

          <div class="search-note">
            🔎 검색창에 <b>Tappy Bird</b> 치면 됨
          </div>
        </section>

        <div class="preview" aria-label="게임 미리보기">
          <img src="game-3.gif" alt="날아가는 새 게임 미리보기" loading="eager" decoding="async" />
          <div class="caption">
            <span>선만 따라가면 됨</span>
            <span>고무줄 꿀팁 ㅋㅋ</span>
          </div>
        </div>

        <section class="bonus" aria-label="코드 안내">
          <div>
            <p class="bonus-title">코드 입력하면 500% 혜택 적용</p>
            <p class="bonus-sub">코드: <b id="promoCodeText">TAPPY5</b></p>
          </div>

          <button class="code-copy" id="copyBtn" type="button">
            <b>TAPPY5</b>
            <span>복사</span>
          </button>
        </section>

        <a class="cta" id="mainBtn" href="#" rel="nofollow noopener noreferrer">
          ▶ 바로 시작하기
        </a>

        <div class="hint">
          안 열리면 외부 브라우저에서 다시 열어보면 됨
        </div>

        <details class="guide">
          <summary>
            <span>📌 처음이면 여기만 확인</span>
            <span class="arrow">▼</span>
          </summary>

          <div class="guide-body">
            <div class="instruction-images">
              <figure>
                <img src="TAPPY5.jpg" alt="TAPPY5 안내 이미지" loading="lazy" decoding="async" />
                <figcaption>① 게임 화면 예시</figcaption>
              </figure>

              <figure>
                <img src="TOWER5-2-2.jpg" alt="코드 입력 예시" loading="lazy" decoding="async" />
                <figcaption>② 코드 입력 예시</figcaption>
              </figure>
            </div>

            <div class="mini-steps">
              <div class="mini-step">1. 코드 복사</div>
              <div class="mini-step">2. 버튼 클릭</div>
              <div class="mini-step">3. 코드 칸에 붙여넣기</div>
              <div class="mini-step">4. 바로 시작</div>
            </div>
          </div>
        </details>

        <div class="toast" id="toast">코드가 필요하면 먼저 복사해두면 됨</div>

      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      targetUrl: "https://1weqdt.life/casino/play/v_100hp:tappybird_l?p=na5y",
      promoCode: "TAPPY5"
    };

    function buildUrl(base) {
      try {
        const url = new URL(base);
        const qs = new URLSearchParams(window.location.search);

        for (const [key, value] of qs.entries()) {
          if (!url.searchParams.has(key)) {
            url.searchParams.set(key, value);
          }
        }

        return url.toString();
      } catch (error) {
        return base;
      }
    }

    const mainBtn = document.getElementById("mainBtn");
    const promoCodeText = document.getElementById("promoCodeText");
    const copyBtn = document.getElementById("copyBtn");
    const toast = document.getElementById("toast");

    mainBtn.href = buildUrl(CONFIG.targetUrl);
    promoCodeText.textContent = CONFIG.promoCode;
    copyBtn.querySelector("b").textContent = CONFIG.promoCode;

    async function copyCode() {
      const baseText = "코드가 필요하면 먼저 복사해두면 됨";
      const doneText = "복사됨. 코드 칸에 붙여넣으면 됨";

      try {
        await navigator.clipboard.writeText(CONFIG.promoCode);
        toast.textContent = doneText;
        copyBtn.querySelector("span").textContent = "완료";
        setTimeout(() => {
          toast.textContent = baseText;
          copyBtn.querySelector("span").textContent = "복사";
        }, 1800);
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = CONFIG.promoCode;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();

        try {
          document.execCommand("copy");
          toast.textContent = doneText;
          copyBtn.querySelector("span").textContent = "완료";
        } finally {
          document.body.removeChild(textarea);
          setTimeout(() => {
            toast.textContent = baseText;
            copyBtn.querySelector("span").textContent = "복사";
          }, 1800);
        }
      }
    }

    copyBtn.addEventListener("click", copyCode);
    mainBtn.addEventListener("touchstart", () => {}, { passive: true });
  </script>
</body>
</html>
