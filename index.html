<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyBird - 꿈을 향해 날아라</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
  <script>
    document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '">');
  </script>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
  <script>
    var __v = Date.now();
    document.write('<script src="config.js?v=' + __v + '"><\/script>');
    document.write('<script src="analytics.js?v=' + __v + '" defer><\/script>');
    document.write('<script src="script.js?v=' + __v + '" defer><\/script>');
  </script>
  <noscript></noscript>
</head>
<body data-page="index">
  <video class="background-video" src="back.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="video-tint" aria-hidden="true"></div>

  <main class="landing">
    <header class="game-header">
      <div class="hero-bird-wrap">
        <a class="hero-bird-link" href="admin.html" aria-label="관리자 패널">
          <img class="hero-bird" src="hero.png" alt="TappyBird 새">
        </a>
      </div>
      <h1>TappyBird</h1>
      <p>꿈을 향해 날아라</p>
    </header>

    <section class="dream-section" aria-label="꿈의 실현">
      <h2>
        <span class="title-line">단 하룻밤 만에</span>
        <span class="title-line">꿈을 이루세요</span>
      </h2>

      <div class="comparison">
        <figure class="shot shot-before">
          <img src="было.jpg" alt="꿈을 이루기 전">
          <figcaption>이전</figcaption>
        </figure>

        <div class="flow-arrow" aria-hidden="true">
          <span class="flow-line"></span>
          <span class="flow-head"></span>
        </div>

        <figure class="shot shot-after">
          <img src="стало.jpg" alt="꿈을 이룬 후">
          <figcaption>이후</figcaption>
        </figure>
      </div>

      <nav class="action-row" aria-label="작업">
        <a class="action-button action-primary" href="https://lkmn.cc/357520" data-track="btn_play">사이트에서 플레이하기</a>
        <a class="action-button action-secondary" href="instruction.html" data-track="btn_instruction">설명서 읽기</a>
      </nav>
    </section>
  </main>
</body>
</html>
