<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>게임 선택</title>
  <meta name="description" content="원하는 게임을 선택하고 프로모션 코드를 확인하세요." />

  <style>
    :root {
      --bg: #06111f;
      --bg2: #0b1730;
      --card: rgba(255, 255, 255, 0.095);
      --card2: rgba(255, 255, 255, 0.14);
      --stroke: rgba(255, 255, 255, 0.16);
      --stroke-strong: rgba(255, 255, 255, 0.24);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.68);
      --soft: rgba(255, 255, 255, 0.48);
      --green: #52ff9a;
      --red: #ff3f64;
      --yellow: #ffd15a;
      --blue: #68d7ff;
      --purple: #b06cff;
      --orange: #ff8a2f;
      --shadow: 0 26px 90px rgba(0, 0, 0, 0.46);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(104, 215, 255, 0.34), transparent 34%),
        radial-gradient(circle at 4% 22%, rgba(255, 63, 100, 0.22), transparent 34%),
        radial-gradient(circle at 100% 72%, rgba(82, 255, 154, 0.16), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(255, 209, 90, 0.12), transparent 34%),
        linear-gradient(180deg, var(--bg2), var(--bg));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.033) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at 50% 24%, black, transparent 78%);
    }

    .page {
      position: relative;
      width: min(100%, 540px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-height: 56px;
      padding: 11px 12px;
      border: 1px solid var(--stroke);
      border-radius: 19px;
      background: rgba(255, 255, 255, 0.075);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.18);
    }

    .stat strong {
      display: block;
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .online-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px var(--green);
      vertical-align: 1px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.72); opacity: 0.58; }
    }

    .promo {
      display: grid;
      gap: 8px;
      margin: 10px 0 14px;
      padding: 13px;
      border: 1px solid rgba(255, 209, 90, 0.34);
      border-radius: 21px;
      background:
        linear-gradient(135deg, rgba(255, 209, 90, 0.20), rgba(255, 63, 100, 0.12)),
        rgba(255, 255, 255, 0.055);
      box-shadow: 0 16px 48px rgba(255, 93, 20, 0.13);
    }

    .promo-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .promo-title {
      color: #fff5cc;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 1000;
      letter-spacing: -0.02em;
    }

    .promo-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 11px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.96);
      color: #101827;
      font-size: 14px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .promo-sub {
      color: rgba(255, 255, 255, 0.70);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 14px;
      padding: 0 2px;
    }

    .hero h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: -0.06em;
      line-height: 1.05;
      font-weight: 1000;
    }

    .hero p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      font-weight: 800;
    }

    .timer {
      display: grid;
      place-items: center;
      min-width: 78px;
      height: 38px;
      padding: 0 14px;
      border: 1px solid var(--stroke-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.085);
      color: #fff;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.20);
      font-size: 14px;
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
    }

    .game-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.07)),
        rgba(16, 22, 42, 0.76);
      box-shadow: var(--shadow);
      isolation: isolate;
      transform: translateZ(0);
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent 42%, rgba(0, 0, 0, 0.30));
    }

    .game-card::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -78px;
      bottom: -78px;
      z-index: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22), transparent 68%);
      pointer-events: none;
    }

    .card-layout {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 44% 1fr;
      min-height: 206px;
    }

    .media {
      position: relative;
      min-height: 206px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
    }

    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.02);
    }

    .media::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,.28));
      pointer-events: none;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      padding: 7px 9px;
      border-radius: 999px;
      color: #101010;
      font-size: 11px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    }

    .badge.hot {
      background: linear-gradient(135deg, #ffdf65, #ff4867);
      color: #fff;
    }

    .badge.new {
      background: linear-gradient(135deg, #7dffb1, #20d2ff);
      color: #072116;
    }

    .content {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 14px 14px;
    }

    .game-title {
      margin: 0;
      font-size: 24px;
      line-height: 0.96;
      letter-spacing: -0.05em;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .game-title small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: none;
    }

    .mini-info {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .chip {
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255,255,255,.11);
      color: rgba(255,255,255,.74);
      font-size: 11px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .play-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #ff325d, #ff7a2f);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 1000;
      box-shadow: 0 14px 32px rgba(255, 69, 55, 0.28);
      cursor: pointer;
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    .play-btn:active {
      transform: scale(0.97);
      filter: brightness(0.94);
    }

    .play-btn.secondary {
      background: linear-gradient(135deg, #36d675, #20d2ff);
      box-shadow: 0 14px 32px rgba(32, 210, 255, 0.21);
      color: #06111f;
    }

    .copy-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      margin-top: 13px;
    }

    .copy-code {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 15px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      font-size: 14px;
      font-weight: 1000;
      letter-spacing: 0.08em;
      overflow: hidden;
      white-space: nowrap;
    }

    .copy-btn {
      min-height: 42px;
      padding: 0 13px;
      border: 0;
      border-radius: 15px;
      background: rgba(255,255,255,.96);
      color: #101827;
      font-size: 13px;
      font-weight: 1000;
      cursor: pointer;
    }

    .toast {
      min-height: 17px;
      margin-top: 9px;
      color: rgba(255,255,255,.50);
      text-align: center;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
    }

    @media (max-width: 420px) {
      .page {
        padding: 14px 10px 22px;
      }

      .card-layout {
        grid-template-columns: 42% 1fr;
        min-height: 194px;
      }

      .media {
        min-height: 194px;
      }

      .content {
        padding: 14px 12px 12px;
      }

      .game-title {
        font-size: 21px;
      }

      .hero h1 {
        font-size: 26px;
      }

      .promo-title {
        font-size: 12px;
      }
    }

    @media (max-width: 360px) {
      .card-layout {
        grid-template-columns: 1fr;
      }

      .media {
        height: 178px;
        min-height: 178px;
      }

      .media::after {
        background: linear-gradient(to bottom, transparent, rgba(0,0,0,.38));
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="topbar" aria-label="실시간 통계">
      <div class="stat">
        <strong><i class="online-dot"></i><span id="onlineCount">2845</span>명</strong>
        <span>지금 플레이 중</span>
      </div>
      <div class="stat">
        <strong>+<span id="winCount">123</span>명</strong>
        <span>최근 1시간 참여</span>
      </div>
    </section>

    <section class="promo" aria-label="프로모션 코드">
      <div class="promo-top">
        <div class="promo-title">프로모션 코드 입력하면 500% 혜택 적용</div>
        <div class="promo-code" id="promoInline">TOWER5</div>
      </div>
      <div class="promo-sub">게임 선택 후 코드 칸이 보이면 그대로 붙여넣으면 됨</div>
    </section>

    <section class="hero">
      <div>
        <h1>지금 인기 게임</h1>
        <p>원하는 게임을 고르고 바로 시작하세요</p>
      </div>
      <div class="timer" id="timer">03:00</div>
    </section>

    <section class="grid" aria-label="게임 목록">
      <article class="game-card">
        <div class="card-layout">
          <div class="media">
            <span class="badge hot">HOT</span>
            <img src="assets/game-3.gif" alt="TAPPY BIRD 미리보기" loading="eager" decoding="async" />
          </div>

          <div class="content">
            <div>
              <h2 class="game-title">
                TAPPY<br>BIRD
                <small>고무줄로 하던 그 새 게임 ㅋㅋ</small>
              </h2>

              <div class="mini-info">
                <span class="chip">🐤 BIRD</span>
                <span class="chip">고무줄 꿀팁</span>
                <span class="chip">빠른 시작</span>
              </div>
            </div>

            <a class="play-btn" id="tappyBtn" href="#" rel="nofollow noopener noreferrer">
              ▶ 플레이
            </a>
          </div>
        </div>
      </article>

      <article class="game-card">
        <div class="card-layout">
          <div class="media">
            <span class="badge new">NEW</span>
            <img src="assets/game-2.gif" alt="TOWER RUSH 미리보기" loading="lazy" decoding="async" />
          </div>

          <div class="content">
            <div>
              <h2 class="game-title">
                TOWER<br>RUSH
                <small>타이밍 맞춰서 건설하는 게임</small>
              </h2>

              <div class="mini-info">
                <span class="chip">🏗️ BUILD</span>
                <span class="chip">타이밍</span>
                <span class="chip">인기 게임</span>
              </div>
            </div>

            <a class="play-btn secondary" id="towerBtn" href="#" rel="nofollow noopener noreferrer">
              ▶ 플레이
            </a>
          </div>
        </div>
      </article>
    </section>

    <section class="copy-row" aria-label="코드 복사">
      <div class="copy-code" id="promoCode">TOWER5</div>
      <button class="copy-btn" type="button" id="copyBtn">복사</button>
    </section>

    <div class="toast" id="toast">필요하면 코드를 먼저 복사해두면 됨</div>
  </main>

  <script>
    const CONFIG = {
      promoCode: "TOWER5",
      countdownSeconds: 180,

      tappyUrl: "https://lkmn.cc/357520",
      towerUrl: "https://lkbb.cc/568d",

      onlineMin: 2360,
      onlineMax: 3920,
      onlineStart: 2845,

      activeMin: 98,
      activeMax: 178,
      activeStart: 123
    };

    const $ = (selector) => document.querySelector(selector);

    const onlineCount = $("#onlineCount");
    const winCount = $("#winCount");
    const timer = $("#timer");
    const promoInline = $("#promoInline");
    const promoCode = $("#promoCode");
    const copyBtn = $("#copyBtn");
    const toast = $("#toast");
    const tappyBtn = $("#tappyBtn");
    const towerBtn = $("#towerBtn");

    let currentOnline = CONFIG.onlineStart;
    let currentActive = CONFIG.activeStart;
    let secondsLeft = CONFIG.countdownSeconds;

    function buildUrl(base) {
      try {
        const url = new URL(base);
        const qs = new URLSearchParams(window.location.search);

        for (const [key, value] of qs.entries()) {
          if (!url.searchParams.has(key)) {
            url.searchParams.set(key, value);
          }
        }

        return url.toString();
      } catch (error) {
        return base;
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateStats() {
      currentOnline = clamp(currentOnline + randomInt(-17, 24), CONFIG.onlineMin, CONFIG.onlineMax);
      currentActive = clamp(currentActive + randomInt(-2, 4), CONFIG.activeMin, CONFIG.activeMax);

      onlineCount.textContent = currentOnline.toLocaleString("ko-KR");
      winCount.textContent = currentActive.toLocaleString("ko-KR");
    }

    function updateTimer() {
      const minutes = Math.floor(secondsLeft / 60).toString().padStart(2, "0");
      const seconds = (secondsLeft % 60).toString().padStart(2, "0");

      timer.textContent = `${minutes}:${seconds}`;

      secondsLeft -= 1;
      if (secondsLeft < 0) secondsLeft = CONFIG.countdownSeconds;
    }

    async function copyCode() {
      const baseText = "필요하면 코드를 먼저 복사해두면 됨";
      const doneText = "복사됨. 코드 칸에 붙여넣으면 됨";

      try {
        await navigator.clipboard.writeText(CONFIG.promoCode);
        toast.textContent = doneText;
        copyBtn.textContent = "완료";

        setTimeout(() => {
          toast.textContent = baseText;
          copyBtn.textContent = "복사";
        }, 1700);
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = CONFIG.promoCode;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);
        textarea.select();

        try {
          document.execCommand("copy");
          toast.textContent = doneText;
          copyBtn.textContent = "완료";
        } finally {
          document.body.removeChild(textarea);

          setTimeout(() => {
            toast.textContent = baseText;
            copyBtn.textContent = "복사";
          }, 1700);
        }
      }
    }

    promoInline.textContent = CONFIG.promoCode;
    promoCode.textContent = CONFIG.promoCode;

    tappyBtn.href = buildUrl(CONFIG.tappyUrl);
    towerBtn.href = buildUrl(CONFIG.towerUrl);

    copyBtn.addEventListener("click", copyCode);

    tappyBtn.addEventListener("touchstart", () => {}, { passive: true });
    towerBtn.addEventListener("touchstart", () => {}, { passive: true });

    updateStats();
    updateTimer();

    setInterval(updateStats, 1900);
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
